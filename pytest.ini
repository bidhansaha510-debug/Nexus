[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: requires Ollama running locally
    unit: fast unit tests that need no external services
addopts = -x --tb=short -q --ignore=tests/verify_anger.py --ignore=tests/verify_independence.py --ignore=tests/verify_persistence.py --ignore=tests/verify_rationality.py --ignore=tests/verify_voice.py --ignore=tests/debug_vector.py --ignore=tests/list_engine_methods.py
timeout = 30
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
